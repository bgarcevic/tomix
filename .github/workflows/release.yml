name: release

# Three ways in:
#   tag push / dispatch on a tag  -> stable or prerelease: GitHub Release + NuGet
#   push to main                  -> preview: NuGet prerelease only
#   dispatch on a branch          -> dry run: build and verify, publish nothing
# Every path builds all archives and runs them on native runners (verify)
# before anything is published, since nuget.org versions are immutable.
# release-pr.yml dispatches this workflow on the tags it creates, because a
# tag pushed with GITHUB_TOKEN does not fire the tag trigger.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches: [main]
    # Not evaluated for tag pushes. Docs-only merges publish no preview.
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

# No cancel-in-progress: cancelling a release mid-publish can strand a
# half-pushed version (nuget.org versions are immutable). The group just
# stops stacked duplicates. On main a newer pending run replaces an older
# pending one, so a burst of merges yields one preview, not one per merge.
concurrency:
  group: release-${{ github.ref }}

jobs:
  plan:
    name: plan
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      major: ${{ steps.plan.outputs.major }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify run
        id: plan
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          kind=dry-run version="" major=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "${version}" == *-* ]]; then kind=prerelease; else kind=stable; fi
            prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "${GITHUB_SHA}^" 2>/dev/null || echo v0.0.0)"
            prev_major="$(cut -d. -f1 <<<"${prev#v}")"
            if (( ${version%%.*} > prev_major )); then
              major=true
            fi
            echo "Release ${version} (previous stable ${prev}, major bump: ${major})" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]]; then
            # The merged release PR is published from its tag; skip its preview.
            if [[ "${HEAD_MESSAGE}" != "chore(release): prepare "* ]]; then
              kind=preview
            fi
          fi
          {
            echo "kind=${kind}"
            echo "version=${version}"
            echo "major=${major}"
          } >> "$GITHUB_OUTPUT"
          echo "Run kind: **${kind}**" >> "$GITHUB_STEP_SUMMARY"

  # Once, not per RID: the archives are cross-published from one Linux runner.
  test:
    name: test
    needs: plan
    if: needs.plan.outputs.kind != 'dry-run' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -m:1 --configuration Release --no-restore
      - run: dotnet test -m:1 --configuration Release --no-build

  publish:
    name: publish ${{ matrix.rid }}
    needs: plan
    if: needs.plan.outputs.kind != 'dry-run' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
            exe: tx.exe
          - rid: win-arm64
            archive: zip
            exe: tx.exe
          - rid: osx-x64
            archive: tar.gz
            exe: tx
          - rid: osx-arm64
            archive: tar.gz
            exe: tx
          - rid: linux-x64
            archive: tar.gz
            exe: tx
          - rid: linux-arm64
            archive: tar.gz
            exe: tx

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Tomix.Cli/Tomix.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/publish/${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          publish_dir="artifacts/publish/${rid}"
          stage_dir="artifacts/stage/tx-${rid}"
          mkdir -p "${stage_dir}"
          cp -R "${publish_dir}/." "${stage_dir}/"
          rm -f "${stage_dir}/Tomix.Cli.pdb"
          if [[ -f "${stage_dir}/Tomix.Cli.exe" ]]; then
            mv "${stage_dir}/Tomix.Cli.exe" "${stage_dir}/${{ matrix.exe }}"
          elif [[ -f "${stage_dir}/Tomix.Cli" ]]; then
            mv "${stage_dir}/Tomix.Cli" "${stage_dir}/${{ matrix.exe }}"
          fi
          cp LICENSE README.md "${stage_dir}/"

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          mkdir -p artifacts/packages
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd artifacts/stage && zip -qr "../packages/tx-${rid}.zip" "tx-${rid}")
          else
            tar -C artifacts/stage -czf "artifacts/packages/tx-${rid}.tar.gz" "tx-${rid}"
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: tx-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error

  pack:
    name: pack tool
    needs: plan
    if: needs.plan.outputs.kind != 'dry-run' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # RuntimeIdentifiers is cleared for the pack only. The SDK drops the tool's
      # implementation whenever that property is set (Microsoft.NET.PackTool.targets
      # decides on RuntimeIdentifiers, not on CreateRidSpecificToolPackages), and
      # emits a payload-less Tomix.Cli that redirects to six Tomix.Cli.<rid>
      # packages instead. Those extra IDs are outside the nuget.org Trusted
      # Publishing policy, so they would 403 while the redirect had already gone
      # live — permanently, since nuget.org versions are immutable. The six
      # self-contained archives are unaffected: the publish job passes --runtime
      # explicitly and never reads this property.
      - name: Pack
        run: >
          dotnet pack src/Tomix.Cli/Tomix.Cli.csproj
          --configuration Release
          --output artifacts/packages
          -p:RuntimeIdentifiers=
          -p:ToolPackageRuntimeIdentifiers=

      - name: Verify the tool package is runnable
        shell: bash
        run: |
          set -euo pipefail
          count=$(ls -1 artifacts/packages/*.nupkg | wc -l)
          if [[ "${count}" -ne 1 ]]; then
            echo "::error::expected exactly 1 tool package, found ${count}"
            ls -1 artifacts/packages/*.nupkg
            exit 1
          fi
          # The RID-redirect wrapper carries no assemblies at all, so the presence
          # of the entry assembly is what separates a usable tool from a manifest
          # pointing at packages this workflow never pushes.
          # grep without -q on purpose: -q exits at the first match, unzip then
          # dies of SIGPIPE, and pipefail reports the whole pipeline as failed.
          if ! unzip -l artifacts/packages/*.nupkg | grep 'tools/net10.0/any/Tomix.Cli.dll' >/dev/null; then
            echo "::error::tool package contains no implementation - it is a RID redirect"
            exit 1
          fi

      # Installs the package the way users do and runs it, so a package that
      # packs fine but cannot start never reaches nuget.org.
      - name: Install and run the tool package
        id: version
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          nupkg="$(basename artifacts/packages/*.nupkg)"
          version="${nupkg#Tomix.Cli.}"
          version="${version%.nupkg}"
          if [[ -n "${EXPECTED}" && "${version}" != "${EXPECTED}" ]]; then
            echo "::error::package version ${version} does not match tag version ${EXPECTED}"
            exit 1
          fi
          dotnet tool install Tomix.Cli --version "${version}" --tool-path artifacts/tool --add-source artifacts/packages
          actual="$(artifacts/tool/tx --version)"
          if [[ "${actual}" != "${version}" ]]; then
            echo "::error::installed tool reports ${actual}, expected ${version}"
            exit 1
          fi
          artifacts/tool/tx ls samples/basic-tmdl --output-format json > /dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: tx-tool-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  # Runs every archive on a native runner of its platform before anything is
  # published: version stamp, startup (embedded native libraries unpack), and
  # an offline model read.
  verify:
    name: verify ${{ matrix.rid }}
    needs: [publish, pack]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: samples/basic-tmdl
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: tx-${{ matrix.rid }}
          path: artifacts

      - name: Run the archive
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          EXPECTED: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          if [[ -f "tx-${RID}.zip" ]]; then
            unzip -q "tx-${RID}.zip"
            tx="tx-${RID}/tx.exe"
          else
            tar -xzf "tx-${RID}.tar.gz"
            tx="tx-${RID}/tx"
          fi
          # tr strips the CR that .NET writes on Windows.
          actual="$("${tx}" --version | tr -d '\r')"
          if [[ "${actual}" != "${EXPECTED}" ]]; then
            echo "::error::archive reports ${actual}, expected ${EXPECTED}"
            exit 1
          fi
          "${tx}" doctor
          "${tx}" ls ../samples/basic-tmdl --output-format json > /dev/null

  # A new major version waits for a maintainer to approve this deployment.
  # The major-release environment must have required reviewers: an
  # environment without protection rules approves itself.
  approve-major:
    name: approve major release
    needs: plan
    if: needs.plan.outputs.major == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: major-release
    steps:
      - run: echo "Major release ${{ needs.plan.outputs.version }} approved."

  release:
    name: publish release
    needs: [plan, test, verify, pack, approve-major]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # approve-major is skipped for non-major releases; always() lets this job
    # run past that skip, so every other gate is checked explicitly.
    if: >
      always() &&
      contains(fromJSON('["stable","prerelease","preview"]'), needs.plan.outputs.kind) &&
      needs.test.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.pack.result == 'success' &&
      (needs.approve-major.result == 'success' || needs.approve-major.result == 'skipped')
    # Required by the nuget.org Trusted Publishing policy, which is registered
    # with Environment: prod. The environment name is a claim in the OIDC token,
    # so a job that omits this key gets a token nuget.org refuses — and it fails
    # at NuGet/login, after the GitHub Release has already been created.
    environment: prod
    permissions:
      contents: write
      id-token: write # OIDC token for NuGet Trusted Publishing
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      # Checkout precedes the artifact download on purpose: actions/checkout
      # cleans the workspace, so running it second would delete the archives.
      - name: Checkout changelog
        if: needs.plan.outputs.kind != 'preview'
        uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/packages
          pattern: tx-*
          merge-multiple: true

      - name: Generate checksums
        if: needs.plan.outputs.kind != 'preview'
        working-directory: artifacts/packages
        run: sha256sum tx-*.zip tx-*.tar.gz > checksums.txt

      # Without this the release body is GitHub's generated commit log, which for
      # a first release compares against the start of history and lists every PR
      # ever merged. The curated section leads; generated notes still follow it.
      - name: Extract release notes
        if: needs.plan.outputs.kind != 'preview'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The newest section runs to end-of-file, so the trailing link-reference
          # definitions come with it; they define compare URLs and are never
          # referenced from the body, so dropping them loses nothing. grep's
          # no-match exit is swallowed so that a missing section reaches the
          # explicit check below instead of tripping pipefail here.
          awk -v v="${version}" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | { grep -v '^\[[^]]*\]: http' || true; } > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section to release from"
            exit 1
          fi

      - name: Create GitHub Release
        if: needs.plan.outputs.kind != 'preview'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/packages/tx-*.zip
            artifacts/packages/tx-*.tar.gz
            artifacts/packages/checksums.txt
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          # Hyphenated tags (v0.1.0-rc.1) are prereleases: excluded from
          # /releases/latest, so install.sh and `tx update` never see them.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # NuGet publishing runs after the GitHub Release so a nuget.org outage can
      # never block the binary channel. Trusted Publishing (OIDC) replaces a
      # long-lived API key: NuGet/login exchanges this job's GitHub OIDC token
      # for a 1-hour key, authorized by the policy configured on nuget.org
      # (owner bgarcevic, repo tomix-cli, workflow file release.yml). All steps
      # no-op when the NUGET_USER secret (nuget.org profile name) is unset
      # (forks, and the canonical repo until the nuget.org policy exists);
      # --skip-duplicate keeps tag re-runs idempotent.
      #
      # The skip is announced rather than silent: skipped steps render grey and
      # the job still concludes green, so without this the release looks entirely
      # successful while the package channel published nothing. Announcing beats
      # failing here — the binary channel is already live by this point, and a
      # hard failure would strand an otherwise complete release.
      - name: Report skipped NuGet publish
        if: env.NUGET_USER == ''
        run: |
          echo "::warning::NUGET_USER is unset - nothing was pushed to nuget.org, so 'dotnet tool install -g Tomix.Cli' will not work for this release."
          {
            echo "### NuGet publish skipped"
            echo
            echo "\`NUGET_USER\` is unset, so no package reached nuget.org."
            echo "The GitHub Release and its archives are unaffected."
            echo
            echo "To publish this version later: configure the nuget.org Trusted"
            echo "Publishing policy, add the \`NUGET_USER\` secret, then re-run this"
            echo "workflow against the tag. \`--skip-duplicate\` makes it idempotent."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup .NET
        if: env.NUGET_USER != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC)
        if: env.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to NuGet
        if: env.NUGET_USER != ''
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push artifacts/packages/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
