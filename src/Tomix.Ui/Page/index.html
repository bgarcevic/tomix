<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tomix</title>
<style nonce="{{nonce}}">
/* Warm neutrals and one persimmon accent (Save, agent edits, the logo). The CLI has no palette of
   its own (it uses the terminal's ANSI colors), so the page keeps its colors here. Status colors only
   tint words that already say what happened; every color keeps 4.5:1 on its theme's surfaces. */
:root{--accent:#b5431c;--on-accent:#fff;--ok:#3f7a2a;--warn:#946300;--bad:#b3261e;--agent:var(--accent);
  --bg:#f5f1e8;--panel:#fffdf8;--line:#e4dccb;--text:#22201c;--muted:#6b665c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--accent:#e2643d;--on-accent:#1a1917;--ok:#7fb069;--warn:#d9a441;--bad:#e5735f;
  --bg:#1a1917;--panel:#211f1c;--line:#33302b;--text:#e8e4dc;--muted:#9a958b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.model{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.state{font-size:12px;color:var(--muted)}
.state.dirty{color:var(--warn)}.state.off{color:var(--bad)}
.actions{margin-left:auto;display:flex;gap:6px}
button{font:inherit;font-size:13px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
main{padding:12px 16px 32px;max-width:900px}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.txn{border:1px solid var(--agent);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.stale{border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stale span{flex:1 1 240px}
.error{border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
ol{list-style:none;margin:0;padding:0}
li{border-bottom:1px solid var(--line);padding:8px 0}
.when{font-size:12px;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.who{font-weight:500}.who.agent{color:var(--agent)}
.what{display:block;font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.k{display:inline-block;width:1.2em;font-family:ui-monospace,monospace;font-size:12px}
.added{color:var(--ok)}.removed{color:var(--bad)}.modified,.renamed,.moved{color:var(--warn)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
footer{font-size:12px;color:var(--muted);margin-top:24px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <span class="logo" aria-hidden="true">tx</span>
  <span class="model" id="model">Connecting…</span>
  <span class="state" id="state"></span>
  <span class="actions">
    <button id="undo" disabled>Undo</button>
    <button id="redo" disabled>Redo</button>
    <button id="save" class="primary" disabled>Save</button>
  </span>
</header>
<main>
  <div class="bar"><span id="clients"></span><span id="steps"></span></div>
  <div class="txn" id="txn" hidden></div>
  <div class="stale" id="stale" role="alert" hidden>
    <span id="stale-text">The model's files changed outside this session, for example by a git checkout or another editor. Saving would overwrite those changes.</span>
    <button id="reload">Reload from disk</button>
    <button id="keep">Keep this version</button>
  </div>
  <div class="stale" id="gone" role="alert" hidden>
    <span id="gone-text"></span>
  </div>
  <div class="error" id="error" role="alert" hidden></div>
  <h2>Activity</h2>
  <ol id="feed" aria-live="polite"><li class="empty" id="nothing">No changes yet. Edits from any client appear here.</li></ol>
  <footer>A temporary page while the tomix UI is built. Leave it open next to your agent.</footer>
</main>
<script nonce="{{nonce}}">
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const $ = id => document.getElementById(id);
const pending = new Map();
let socket, nextId = 0, me = "";

function request(method, params) {
  const id = ++nextId;
  socket.send(JSON.stringify({ jsonrpc: "2.0", id, method, params }));
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}

function leaf(path) {
  if (!path) return "No model open";
  const parts = path.replace(/[\\/]+$/, "").split(/[\\/]/);
  return parts[parts.length - 1] || path;
}

function time(date) {
  return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function showError(message) {
  $("error").textContent = message;
  $("error").hidden = !message;
}

async function refresh() {
  const response = await fetch("/status?token=" + encodeURIComponent(token), { cache: "no-store" });
  if (!response.ok) return;
  const status = await response.json();
  $("model").textContent = leaf(status.model);
  $("model").title = status.model || "";
  const state = $("state");
  const stale = status.state === "stale";
  const server = status.canReload === false;
  state.textContent = stale ? (server ? "● changed on the server" : "● files changed on disk") : status.dirty ? "● unsaved changes" : status.state === "closed" ? "" : "saved";
  state.className = "state" + (stale || status.dirty ? " dirty" : "");
  $("stale").hidden = !stale;
  $("stale-text").textContent = server
    ? "The model changed on the server outside this session, for example in Power BI Desktop or by a refresh. Saving would overwrite those changes; to take the server's version, connect again."
    : "The model's files changed outside this session, for example by a git checkout or another editor. Saving would overwrite those changes.";
  $("reload").hidden = server;
  $("reload").dataset.dirty = status.dirty ? "1" : "";
  const others = status.clients.filter(id => id !== me);
  $("clients").textContent = others.length ? "Also here: " + others.join(", ") : "No other clients";
  $("steps").textContent = status.undoSteps + " undo · " + status.redoSteps + " redo";
  $("undo").disabled = !status.undoSteps;
  $("redo").disabled = !status.redoSteps;
  const gone = status.sourceUnavailable === true;
  $("gone").hidden = !gone;
  $("gone-text").textContent = (/^(localhost|127\.0\.0\.1):/i.test(status.model || "") ? "Power BI Desktop is no longer running" : "The server cannot be reached")
    + ", so this session cannot save to it. Its changes are still here: run 'save -o <folder>' in a shell on this session to write them to files.";
  $("save").disabled = !status.dirty || gone;
  const txn = status.transaction;
  $("txn").hidden = !txn;
  if (txn) $("txn").textContent = txn.client + " is editing" + (txn.label ? ": “" + txn.label + "”" : "") + ". Its changes appear when it commits.";
}

function add(who, lines) {
  $("nothing").hidden = true;
  const item = document.createElement("li");
  const when = document.createElement("span");
  when.className = "when";
  when.textContent = time(new Date());
  const name = document.createElement("span");
  name.className = "who" + (who && who !== me ? " agent" : "");
  name.textContent = who === me ? "You" : who || "tomix";
  item.append(when, name);
  for (const line of lines) {
    const what = document.createElement("span");
    what.className = "what";
    if (line.kind) {
      const k = document.createElement("span");
      k.className = "k " + line.kind;
      k.textContent = { added: "A", removed: "D", modified: "M", renamed: "R", moved: "R" }[line.kind] || "·";
      what.append(k);
    }
    what.append(document.createTextNode(line.text));
    item.append(what);
  }
  $("feed").prepend(item);
}

function describe(change) {
  const kind = change.objectKind ? change.objectKind + " " : "";
  switch (change.change) {
    case "renamed":
    case "moved": return kind + change.oldPath + " → " + change.path;
    case "modified": return kind + change.path + (change.properties ? " · " + change.properties.join(", ") : "");
    default: return kind + change.path;
  }
}

// A switch, not a lookup by name: a method name the server sends picks no function itself.
function onEvent(method, p) {
  switch (method) {
    case "model.changed": {
      const lines = (p.changes || []).slice(0, 20).map(c => ({ kind: c.change, text: describe(c) }));
      if ((p.changes || []).length > 20) lines.push({ text: "and " + (p.changes.length - 20) + " more" });
      const via = p.origin && p.origin.kind !== "apply" ? " (" + p.origin.kind + ")" : "";
      if (via) lines.unshift({ text: p.origin.kind === "undo" ? "Undid a step" : p.origin.kind === "redo" ? "Redid a step" : "Reloaded" });
      add(p.origin && p.origin.client, lines);
      break;
    }
    case "session.saved":
      add(null, [{ text: "Saved to " + p.savedTo }]);
      break;
    case "transaction.closed":
      if (p.outcome !== "committed") add(p.client, [{ text: "Rolled back its open changes" }]);
      break;
  }
}

function connect() {
  socket = new WebSocket("ws://" + location.host + "/ws?token=" + encodeURIComponent(token));
  socket.onopen = async () => {
    showError("");
    const init = await request("initialize", { protocolVersion: "0", clientInfo: { name: "tomix-ui" } });
    me = init.clientId;
    await refresh();
  };
  socket.onmessage = message => {
    const data = JSON.parse(message.data);
    if ("id" in data && !data.method) {
      const waiter = pending.get(data.id);
      pending.delete(data.id);
      if (!waiter) return;
      const hint = data.error && data.error.data && data.error.data.hint;
      if (data.error) waiter.reject(new Error(data.error.message + (hint ? " " + hint : "")));
      else waiter.resolve(data.result);
      return;
    }
    onEvent(data.method, data.params || {});
    refresh();
  };
  socket.onclose = () => {
    $("state").textContent = "disconnected — is tx ui still running?";
    $("state").className = "state off";
    for (const id of ["undo", "redo", "save"]) $(id).disabled = true;
    setTimeout(connect, 2000);
  };
}

for (const [id, method] of [["undo", "session.undo"], ["redo", "session.redo"], ["save", "session.save"]]) {
  $(id).addEventListener("click", async () => {
    try { showError(""); await request(method, {}); } catch (error) { showError(error.message); }
    refresh();
  });
}

// Reload discards unsaved changes, so it asks first; keeping this version saves over the files.
$("reload").addEventListener("click", async () => {
  const dirty = !!$("reload").dataset.dirty;
  if (dirty && !confirm("Reload the model from disk? This discards the session's unsaved changes and its undo history.")) return;
  try { showError(""); await request("session.reload", { discard: dirty }); } catch (error) { showError(error.message); }
  refresh();
});
$("keep").addEventListener("click", async () => {
  const where = $("reload").hidden ? "the server's model" : "the files";
  if (!confirm("Save this session's version over " + where + ", discarding the changes made outside it?")) return;
  try { showError(""); await request("session.save", { force: true }); } catch (error) { showError(error.message); }
  refresh();
});

connect();
// Clients joining and leaving send no event: the status, which is cheap to read, is polled.
setInterval(() => { if (socket.readyState === WebSocket.OPEN) refresh(); }, 2000);
</script>
</body>
</html>
